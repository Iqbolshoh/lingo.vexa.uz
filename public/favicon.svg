<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <radialGradient id="s-body" cx="38%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#2fae9a"/>
      <stop offset="55%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0b4f4a"/>
    </radialGradient>
    <radialGradient id="s-belly" cx="45%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fffaf0"/>
      <stop offset="100%" stop-color="#f3dfbd"/>
    </radialGradient>
    <radialGradient id="s-face" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#fffdf7"/>
      <stop offset="100%" stop-color="#f6e5c6"/>
    </radialGradient>
    <radialGradient id="s-iris" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#b9773a"/>
      <stop offset="100%" stop-color="#6b3a14"/>
    </radialGradient>
    <linearGradient id="s-wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14897c"/>
      <stop offset="100%" stop-color="#0a5a53"/>
    </linearGradient>
    <linearGradient id="s-scarf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="s-beak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#031e33" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Modern Squircle Background -->
  <rect width="512" height="512" rx="116" fill="url(#tileBg)"/>
  <rect x="8" y="8" width="496" height="496" rx="108" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.22"/>

  <!-- Golden spark in top-right -->
  <path d="M 432 76 Q 432 94 450 94 Q 432 94 432 112 Q 432 94 414 94 Q 432 94 432 76 Z" fill="#fbbf24" opacity="0.9"/>
  <circle cx="432" cy="94" r="3" fill="#ffffff"/>

  <!-- Lingo Bird Mascot (Scale 2.16, centered) -->
  <g transform="translate(42, 28) scale(2.15)" filter="url(#tileShadow)">
    <!-- Shadow -->
    <ellipse cx="100" cy="221" rx="46" ry="6" fill="#0b2e2b" opacity=".2"/>

    <!-- Feet -->
    <g fill="#f97316">
      <path d="M76 204c-4 5-9 7-12 6 3-3 4-5 4-8zm8 1c-1 6-4 9-7 10 1-4 1-7 0-9zm7-2c1 6 0 9-2 11-1-4-2-7-3-9z"/>
      <path d="M124 204c4 5 9 7 12 6-3-3-4-5-4-8zm-8 1c1 6 4 9 7 10-1-4-1-7 0-9zm-7-2c-1 6 0 9 2 11 1-4 2-7 3-9z"/>
    </g>

    <!-- Ear tufts -->
    <path d="M52 52c-6-16-4-28 2-36 6 10 14 18 24 22z" fill="url(#s-body)"/>
    <path d="M148 52c6-16 4-28-2-36-6 10-14 18-24 22z" fill="url(#s-body)"/>

    <!-- Body -->
    <path d="M100 26c44 0 72 30 72 82 0 56-30 98-72 98s-72-42-72-98c0-52 28-82 72-82z" fill="url(#s-body)"/>
    <path d="M58 50c10-12 26-18 42-18" stroke="#5eead4" stroke-width="4" stroke-linecap="round" fill="none" opacity=".35"/>

    <!-- Belly with feather scallops -->
    <path d="M100 112c30 0 46 22 46 50 0 26-20 42-46 42s-46-16-46-42c0-28 16-50 46-50z" fill="url(#s-belly)"/>
    <g fill="none" stroke="#e2c48f" stroke-width="2.2" stroke-linecap="round" opacity=".8">
      <path d="M80 150q5 5 10 0M95 150q5 5 10 0M110 150q5 5 10 0"/>
      <path d="M72 166q5 5 10 0M87 166q5 5 10 0M102 166q5 5 10 0M117 166q5 5 10 0"/>
      <path d="M80 182q5 5 10 0M95 182q5 5 10 0M110 182q5 5 10 0"/>
    </g>

    <!-- Wings -->
    <g>
      <path d="M36 112c-14 14-18 40-10 62 4 10 12 14 20 10 4-22 6-46 2-70-4-4-8-5-12-2z" fill="url(#s-wing)"/>
      <path d="M32 140c4 10 6 22 6 34M40 130c3 12 4 26 2 40" stroke="#5eead4" stroke-width="1.8" stroke-linecap="round" fill="none" opacity=".35"/>
    </g>
    <g>
      <path d="M164 112c14 14 18 40 10 62-4 10-12 14-20 10-4-22-6-46-2-70 4-4 8-5 12-2z" fill="url(#s-wing)"/>
      <path d="M168 140c-4 10-6 22-6 34M160 130c-3 12-4 26-2 40" stroke="#5eead4" stroke-width="1.8" stroke-linecap="round" fill="none" opacity=".35"/>
    </g>

    <!-- Scarf -->
    <g>
      <path d="M54 112c14 10 30 14 46 14s32-4 46-14l4 12c-14 12-32 18-50 18s-36-6-50-18z" fill="url(#s-scarf)"/>
      <path d="M54 112c14 10 30 14 46 14s32-4 46-14" stroke="#99f6e4" stroke-width="2" fill="none" opacity=".6"/>
      <g>
        <path d="M70 128c-4 14-2 30 4 42l14-4c-4-12-4-24-2-34z" fill="url(#s-scarf)"/>
        <path d="M74 166l14-4M73 160l14-4" stroke="#0f766e" stroke-width="1.6" opacity=".5"/>
      </g>
    </g>

    <!-- Head & Face -->
    <g>
      <path d="M100 58c-14-12-46-12-56 10-8 20 6 44 30 44 12 0 20-6 26-12 6 6 14 12 26 12 24 0 38-24 30-44-10-22-42-22-56-10z" fill="url(#s-face)"/>
      <ellipse cx="60" cy="104" rx="9" ry="5" fill="#fb7185" opacity=".32"/>
      <ellipse cx="140" cy="104" rx="9" ry="5" fill="#fb7185" opacity=".32"/>

      <!-- Eyes -->
      <circle cx="76" cy="82" r="17" fill="#ffffff"/>
      <circle cx="124" cy="82" r="17" fill="#ffffff"/>
      <g>
        <circle cx="78" cy="83" r="11" fill="url(#s-iris)"/>
        <circle cx="122" cy="83" r="11" fill="url(#s-iris)"/>
        <circle cx="78" cy="83" r="5.5" fill="#1c1208"/>
        <circle cx="122" cy="83" r="5.5" fill="#1c1208"/>
        <circle cx="82" cy="78" r="3.4" fill="#ffffff"/>
        <circle cx="126" cy="78" r="3.4" fill="#ffffff"/>
        <circle cx="75" cy="87" r="1.6" fill="#ffffff" opacity=".8"/>
        <circle cx="119" cy="87" r="1.6" fill="#ffffff" opacity=".8"/>
      </g>

      <!-- Glasses -->
      <g fill="none" stroke="#111827" stroke-width="4.2">
        <circle cx="76" cy="82" r="20"/>
        <circle cx="124" cy="82" r="20"/>
        <path d="M96 80q4-4 8 0" stroke-linecap="round"/>
        <path d="M56 78l-8-4M144 78l8-4" stroke-linecap="round"/>
      </g>
      <path d="M63 70q6-5 13-4M137 70q-6-5-13-4" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" fill="none" opacity=".55"/>

      <!-- Beak -->
      <g>
        <path d="M93 104q7 10 14 0z" fill="#d97706"/>
        <path d="M100 92c6 0 10 4 10 8 0 4-6 8-10 12-4-4-10-8-10-12 0-4 4-8 10-8z" fill="url(#s-beak)"/>
        <path d="M96 97q4-2 8 0" stroke="#fff7cc" stroke-width="1.6" stroke-linecap="round" fill="none"/>
      </g>
    </g>

    <!-- Star Sparkles in Gold -->
    <g fill="#fbbf24">
      <path d="M26 40l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
      <path d="M176 56l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>
    </g>
  </g>
</svg>