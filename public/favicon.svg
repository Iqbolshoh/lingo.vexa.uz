<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="s-body" cx="38%" cy="28%" r="80%">
      <stop offset="0" stop-color="#2fae9a"/>
      <stop offset="55" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0b4f4a"/>
    </radialGradient>
    <radialGradient id="s-belly" cx="45%" cy="30%" r="75%">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="100%" stop-color="#f3dfbd"/>
    </radialGradient>
    <radialGradient id="s-face" cx="50%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="100%" stop-color="#f6e5c6"/>
    </radialGradient>
    <radialGradient id="s-iris" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#b9773a"/>
      <stop offset="100%" stop-color="#6b3a14"/>
    </radialGradient>
    <linearGradient id="s-wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14897c"/>
      <stop offset="100%" stop-color="#0a5a53"/>
    </linearGradient>
    <linearGradient id="s-scarf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="s-beak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f766e" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Clean Pure White Background -->
  <rect width="512" height="512" rx="112" fill="#ffffff"/>

  <!-- Centered Lingo Mascot Face Close-up -->
  <g transform="translate(256, 256) scale(3.18) translate(-100, -85)" filter="url(#softShadow)">
    <!-- Ear tufts -->
    <path d="M52 52c-6-16-4-28 2-36 6 10 14 18 24 22z" fill="url(#s-body)"/>
    <path d="M148 52c6-16 4-28-2-36-6 10-14 18-24 22z" fill="url(#s-body)"/>

    <!-- Head & Body Contour -->
    <path d="M100 26c44 0 72 30 72 82 0 34-12 60-32 78-12 10-26 14-40 14s-28-4-40-14c-20-18-32-44-32-78 0-52 28-82 72-82z" fill="url(#s-body)"/>
    <path d="M58 50c10-12 26-18 42-18" stroke="#5eead4" stroke-width="4.5" stroke-linecap="round" fill="none" opacity=".45"/>

    <!-- Turquoise Scarf -->
    <g>
      <path d="M52 110c14 11 31 16 48 16s34-5 48-16l4 14c-15 13-34 20-52 20s-37-7-52-20z" fill="url(#s-scarf)"/>
      <path d="M52 110c14 11 31 16 48 16s34-5 48-16" stroke="#99f6e4" stroke-width="2.4" fill="none" opacity=".7"/>
      <!-- Scarf tail -->
      <path d="M68 126c-4 13-2 26 4 36l12-3c-4-10-4-20-2-28z" fill="url(#s-scarf)"/>
    </g>

    <!-- Face Plate -->
    <path d="M100 58c-14-12-46-12-56 10-8 20 6 44 30 44 12 0 20-6 26-12 6 6 14 12 26 12 24 0 38-24 30-44-10-22-42-22-56-10z" fill="url(#s-face)"/>

    <!-- Rosy Cheeks -->
    <ellipse cx="58" cy="103" rx="10" ry="5.5" fill="#fb7185" opacity=".35"/>
    <ellipse cx="142" cy="103" rx="10" ry="5.5" fill="#fb7185" opacity=".35"/>

    <!-- Big Eyes -->
    <circle cx="76" cy="82" r="17.5" fill="#ffffff"/>
    <circle cx="124" cy="82" r="17.5" fill="#ffffff"/>
    <g>
      <circle cx="78" cy="83" r="11.5" fill="url(#s-iris)"/>
      <circle cx="122" cy="83" r="11.5" fill="url(#s-iris)"/>
      <circle cx="78" cy="83" r="5.8" fill="#1c1208"/>
      <circle cx="122" cy="83" r="5.8" fill="#1c1208"/>
      <circle cx="82" cy="78" r="3.6" fill="#ffffff"/>
      <circle cx="126" cy="78" r="3.6" fill="#ffffff"/>
      <circle cx="75" cy="87" r="1.8" fill="#ffffff" opacity=".9"/>
      <circle cx="119" cy="87" r="1.8" fill="#ffffff" opacity=".9"/>
    </g>

    <!-- Glasses (bold, crisp black rims) -->
    <g fill="none" stroke="#111827" stroke-width="4.6">
      <circle cx="76" cy="82" r="20.5"/>
      <circle cx="124" cy="82" r="20.5"/>
      <path d="M96.5 80q3.5-4 7 0" stroke-linecap="round"/>
      <path d="M55.5 78l-9-4M144.5 78l9-4" stroke-linecap="round"/>
    </g>
    <path d="M63 70q6-5 13-4M137 70q-6-5-13-4" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" fill="none" opacity=".65"/>

    <!-- Golden Beak -->
    <g>
      <path d="M92 104q8 11 16 0z" fill="#d97706"/>
      <path d="M100 91c7 0 11 4 11 9 0 5-7 9-11 13-4-4-11-8-11-13 0-5 4-9 11-9z" fill="url(#s-beak)"/>
      <path d="M95.5 96.5q4.5-2.2 9 0" stroke="#fff7cc" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Sparkles -->
    <g fill="#f59e0b">
      <path d="M26 38l2.5 7 7 2.5-7 2.5-2.5 7-2.5-7-7-2.5 7-2.5z"/>
      <path d="M176 54l2 5.5 5.5 2-5.5 2-2 5.5-2-5.5-5.5-2 5.5-2z"/>
    </g>
  </g>
</svg>