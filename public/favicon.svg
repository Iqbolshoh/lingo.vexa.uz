<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="64" height="64" rx="16" fill="url(#favBg)"/>

  <!-- Gold Decorative Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#favGold)" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- Registon Arch / Turquoise Dome Silhouette -->
  <!-- Base portal arch -->
  <path d="M 16 52 L 16 34 C 16 22, 24 16, 32 12 C 40 16, 48 22, 48 34 L 48 52 Z" fill="#0369a1" stroke="url(#favGold)" stroke-width="2"/>

  <!-- Inner pointed arch -->
  <path d="M 22 52 L 22 36 C 22 28, 27 22, 32 18 C 37 22, 42 28, 42 36 L 42 52 Z" fill="#0284c7"/>

  <!-- Traditional Chust Do'ppi on top with white almond pattern -->
  <path d="M 23 38 C 23 28, 32 23, 32 23 C 32 23, 41 28, 41 38 Z" fill="#09090b"/>
  <!-- Bodomgul embroidery dots -->
  <circle cx="28" cy="33" r="1.5" fill="#ffffff"/>
  <circle cx="36" cy="33" r="1.5" fill="#ffffff"/>
  <path d="M 24 38 Q 32 35 40 38" stroke="#ffffff" stroke-width="1" fill="none"/>

  <!-- Letter L (Lingo) in Gold -->
  <text x="32" y="49" font-family="'Fredoka', system-ui, sans-serif" font-size="14" font-weight="900" fill="#fbbf24" text-anchor="middle">L</text>

  <!-- Star sparkle -->
  <circle cx="46" cy="18" r="2" fill="#fbbf24"/>
</svg>
