  </g>
  <g class="owl-fx owl-fx--spark" fill="#fbbf24">
    <path d="M26 40l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/><path d="M176 56l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>
