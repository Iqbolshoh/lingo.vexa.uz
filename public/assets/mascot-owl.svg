<svg class="owl-svg" width="200" height="230" viewBox="0 0 200 230" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><style>

.owl { display: inline-block; width: var(--owl-size, 120px); height: calc(var(--owl-size, 120px) * 1.15); line-height: 0; flex: none; }
.owl-svg { width: 100%; height: 100%; overflow: visible; }
.owl-svg * { transform-box: fill-box; }

.owl-rig { transform-origin: 50% 100%; }
.owl-breath { transform-origin: 50% 100%; animation: owl-breath 3.2s ease-in-out infinite; }
.owl-head { transform-origin: 50% 80%; animation: owl-tilt 7s ease-in-out infinite; }
.owl-pupils { transform-origin: center; animation: owl-look 9s ease-in-out infinite; }
.owl-lid { transform-origin: 50% 0; transform: scaleY(0); animation: owl-blink 4.6s infinite; }
.owl-happy, .owl-closed { opacity: 0; }
.owl-wing--l { transform-origin: 70% 10%; animation: owl-flap-l 3.2s ease-in-out infinite; }
.owl-wing--r { transform-origin: 30% 10%; animation: owl-flap-r 3.2s ease-in-out infinite; }
.owl-scarf-tail { transform-origin: 50% 0; animation: owl-scarf 2.6s ease-in-out infinite; }
.owl-book { transform-origin: 30% 80%; }
.owl-beak-low { transform-origin: 50% 0; }
.owl-shadow { transform-origin: center; animation: owl-shadow 3.2s ease-in-out infinite; }
.owl-fx, .owl-confetti { opacity: 0; }

@keyframes owl-breath { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.015, 1.03); } }
@keyframes owl-tilt { 0%, 40%, 100% { transform: rotate(0); } 50%, 60% { transform: rotate(-4deg); } 75%, 85% { transform: rotate(3deg); } }
@keyframes owl-look { 0%, 30%, 100% { transform: translate(0, 0); } 36%, 48% { transform: translate(3px, -1px); } 54%, 66% { transform: translate(-3px, 1px); } }
@keyframes owl-blink { 0%, 92%, 100% { transform: scaleY(0); } 95% { transform: scaleY(1); } }
@keyframes owl-flap-l { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(4deg); } }
@keyframes owl-flap-r { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-4deg); } }
@keyframes owl-scarf { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(7deg); } }
@keyframes owl-shadow { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(1.04); } }


.owl--welcome .owl-wing--r { animation: owl-wave 1.1s ease-in-out infinite; }
.owl--welcome .owl-happy, .owl--success .owl-happy, .owl--celebrate .owl-happy, .owl--encourage .owl-happy { opacity: 1; }
.owl--welcome .owl-pupils, .owl--success .owl-pupils, .owl--celebrate .owl-pupils, .owl--encourage .owl-pupils,
.owl--welcome .owl-lid, .owl--success .owl-lid, .owl--celebrate .owl-lid, .owl--encourage .owl-lid { opacity: 0; }
.owl--welcome .owl-breath { animation: owl-bounce-soft 1.1s ease-in-out infinite; }
@keyframes owl-wave { 0%, 100% { transform: rotate(-95deg); } 50% { transform: rotate(-130deg); } }
@keyframes owl-bounce-soft { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }


.owl--thinking .owl-head { animation: none; transform: rotate(9deg); transition: transform .3s; }
.owl--thinking .owl-pupils { animation: none; transform: translate(-3px, -4px); }
.owl--thinking .owl-wing--r { animation: none; transform: rotate(-35deg); }
.owl--thinking .owl-fx--think { opacity: 1; }
.owl--thinking .owl-fx--think circle { animation: owl-dots 1.5s ease-in-out infinite; transform-origin: center; }
.owl--thinking .owl-fx--think circle:nth-child(2) { animation-delay: .2s; }
.owl--thinking .owl-fx--think circle:nth-child(3) { animation-delay: .4s; }
@keyframes owl-dots { 0%, 100% { transform: scale(.7); opacity: .5; } 50% { transform: scale(1.1); opacity: 1; } }


.owl--learning .owl-book { transform: translate(-22px, -40px) rotate(-6deg) scale(1.25); transition: transform .4s; }
.owl--learning .owl-pupils { animation: owl-read 2.4s ease-in-out infinite; }
.owl--learning .owl-wing--l { animation: none; transform: rotate(-28deg); }
.owl--learning .owl-wing--r { animation: none; transform: rotate(18deg); }
.owl--learning .owl-head { animation: owl-nod 2.4s ease-in-out infinite; }
@keyframes owl-read { 0%, 100% { transform: translate(-3px, 4px); } 50% { transform: translate(3px, 4px); } }
@keyframes owl-nod { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(2.5deg) translateY(1px); } }


.owl--success .owl-rig { animation: owl-hop .7s cubic-bezier(.3, 1.6, .5, 1) infinite; }
.owl--success .owl-wing--l { animation: none; transform: rotate(120deg); }
.owl--success .owl-wing--r { animation: none; transform: rotate(-120deg); }
.owl--success .owl-fx--spark { opacity: 1; animation: owl-twinkle .7s ease-in-out infinite; }
@keyframes owl-hop { 0%, 100% { transform: translateY(0) scale(1, 1); } 15% { transform: translateY(0) scale(1.06, .94); } 50% { transform: translateY(-10px) scale(.97, 1.03); } }
@keyframes owl-twinkle { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }


.owl--celebrate .owl-rig { animation: owl-jump .9s cubic-bezier(.3, 1.4, .5, 1) infinite; }
.owl--celebrate .owl-wing--l { animation: owl-cheer-l .45s ease-in-out infinite alternate; }
.owl--celebrate .owl-wing--r { animation: owl-cheer-r .45s ease-in-out infinite alternate; }
.owl--celebrate .owl-confetti { opacity: 1; }
.owl--celebrate .owl-confetti-bit { transform-origin: center; animation: owl-confetti 1.6s linear infinite; animation-delay: var(--d); }
.owl--celebrate .owl-shadow { animation: owl-shadow-jump .9s ease-in-out infinite; }
@keyframes owl-jump { 0%, 100% { transform: translateY(0) scale(1, 1); } 12% { transform: translateY(0) scale(1.08, .92); } 45% { transform: translateY(-22px) scale(.96, 1.05) rotate(-3deg); } 70% { transform: translateY(-8px) rotate(3deg); } }
@keyframes owl-cheer-l { from { transform: rotate(100deg); } to { transform: rotate(140deg); } }
@keyframes owl-cheer-r { from { transform: rotate(-100deg); } to { transform: rotate(-140deg); } }
@keyframes owl-confetti { 0% { transform: translateY(-10px) rotate(0); opacity: 0; } 10% { opacity: 1; } 100% { transform: translateY(190px) rotate(var(--r)); opacity: 0; } }
@keyframes owl-shadow-jump { 0%, 100% { transform: scaleX(1); opacity: .18; } 45% { transform: scaleX(.7); opacity: .08; } }


.owl--mistake .owl-head { animation: owl-puzzle 1.8s ease-in-out infinite; }
.owl--mistake .owl-pupils { animation: none; transform: translate(4px, 0) scale(.92); }
.owl--mistake .owl-wing--r { animation: none; transform: rotate(-60deg); }
.owl--mistake .owl-fx--q { opacity: 1; animation: owl-q 1.8s ease-in-out infinite; transform-origin: center; }
@keyframes owl-puzzle { 0%, 100% { transform: rotate(-11deg); } 50% { transform: rotate(-7deg); } }
@keyframes owl-q { 0%, 100% { transform: translateY(0) rotate(8deg); } 50% { transform: translateY(-4px) rotate(-4deg); } }


.owl--encourage .owl-wing--r { animation: owl-thumb 1.4s ease-in-out infinite; }
.owl--encourage .owl-head { animation: owl-nod 1.4s ease-in-out infinite; }
.owl--encourage .owl-fx--spark { opacity: .9; }
@keyframes owl-thumb { 0%, 100% { transform: rotate(-150deg) translateY(0); } 50% { transform: rotate(-160deg) translateY(-3px); } }


.owl--sleeping .owl-lid { animation: none; transform: scaleY(1); }
.owl--sleeping .owl-pupils { animation: none; }
.owl--sleeping .owl-closed { opacity: 1; }
.owl--sleeping .owl-rig { animation: owl-sway 4s ease-in-out infinite; }
.owl--sleeping .owl-breath { animation-duration: 4s; }
.owl--sleeping .owl-head { animation: none; transform: rotate(-6deg) translateY(2px); }
.owl--sleeping .owl-fx--zzz { opacity: 1; }
.owl--sleeping .owl-fx--zzz text { animation: owl-z 3s ease-in-out infinite; transform-origin: center; opacity: 0; }
.owl--sleeping .owl-fx--zzz .z2 { animation-delay: 1s; }
.owl--sleeping .owl-fx--zzz .z3 { animation-delay: 2s; }
@keyframes owl-sway { 0%, 100% { transform: rotate(-2.5deg); } 50% { transform: rotate(2.5deg); } }
@keyframes owl-z { 0% { opacity: 0; transform: translate(0, 6px) scale(.6); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(6px, -10px) scale(1.1); } }


.owl--speaking .owl-beak-low { animation: owl-talk .26s ease-in-out infinite alternate; }
.owl--speaking .owl-head { animation: owl-nod .52s ease-in-out infinite; }
.owl--speaking .owl-wing--l { animation: owl-gesture 1s ease-in-out infinite; }
@keyframes owl-talk { from { transform: scaleY(.3); } to { transform: scaleY(1.9) translateY(1px); } }
@keyframes owl-gesture { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(22deg); } }

.owl-beak-low { transform: scaleY(.3); }


.owl.owl--mini .owl-fx, .owl.owl--mini .owl-confetti { display: none; }

@media (prefers-reduced-motion: reduce) {
    .owl *, .owl-svg * { animation: none !important; }
}
</style>
  <defs>
    <radialGradient id="s-body" cx="38%" cy="28%" r="80%">
      <stop offset="0" stop-color="#2fae9a"/><stop offset=".55" stop-color="#0f766e"/><stop offset="1" stop-color="#0b4f4a"/>
    </radialGradient>
    <radialGradient id="s-belly" cx="45%" cy="30%" r="75%">
      <stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#f3dfbd"/>
    </radialGradient>
    <radialGradient id="s-face" cx="50%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fffdf7"/><stop offset="1" stop-color="#f6e5c6"/>
    </radialGradient>
    <radialGradient id="s-iris" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#b9773a"/><stop offset="1" stop-color="#6b3a14"/>
    </radialGradient>
    <linearGradient id="s-wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14897c"/><stop offset="1" stop-color="#0a5a53"/>
    </linearGradient>
    <linearGradient id="s-scarf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="s-beak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde047"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="s-book" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <ellipse class="owl-shadow" cx="100" cy="221" rx="46" ry="6" fill="#0b2e2b" opacity=".18"/>
  <g class="owl-confetti"><rect class="owl-confetti-bit" x="28" y="8" width="6" height="9" rx="1.5" fill="#f59e0b" style="--d:0s;--r:-120deg"/><rect class="owl-confetti-bit" x="41" y="15" width="6" height="9" rx="1.5" fill="#10b981" style="--d:0.11s;--r:145deg"/><rect class="owl-confetti-bit" x="54" y="22" width="6" height="9" rx="1.5" fill="#38bdf8" style="--d:0.22s;--r:-170deg"/><rect class="owl-confetti-bit" x="67" y="29" width="6" height="9" rx="1.5" fill="#f43f5e" style="--d:0.33s;--r:195deg"/><rect class="owl-confetti-bit" x="80" y="36" width="6" height="9" rx="1.5" fill="#a78bfa" style="--d:0.44s;--r:-220deg"/><rect class="owl-confetti-bit" x="93" y="13" width="6" height="9" rx="1.5" fill="#fbbf24" style="--d:0.55s;--r:245deg"/><rect class="owl-confetti-bit" x="106" y="20" width="6" height="9" rx="1.5" fill="#f59e0b" style="--d:0.66s;--r:-270deg"/><rect class="owl-confetti-bit" x="119" y="27" width="6" height="9" rx="1.5" fill="#10b981" style="--d:0.77s;--r:295deg"/><rect class="owl-confetti-bit" x="132" y="34" width="6" height="9" rx="1.5" fill="#38bdf8" style="--d:0.88s;--r:-320deg"/><rect class="owl-confetti-bit" x="145" y="11" width="6" height="9" rx="1.5" fill="#f43f5e" style="--d:0.99s;--r:345deg"/><rect class="owl-confetti-bit" x="158" y="18" width="6" height="9" rx="1.5" fill="#a78bfa" style="--d:1.1s;--r:-370deg"/><rect class="owl-confetti-bit" x="171" y="25" width="6" height="9" rx="1.5" fill="#fbbf24" style="--d:1.21s;--r:395deg"/></g>

  <g class="owl-rig">
    <g class="owl-feet">
      <path d="M76 204c-4 5-9 7-12 6 3-3 4-5 4-8zm8 1c-1 6-4 9-7 10 1-4 1-7 0-9zm7-2c1 6 0 9-2 11-1-4-2-7-3-9z" fill="#f97316"/>
      <path d="M124 204c4 5 9 7 12 6-3-3-4-5-4-8zm-8 1c1 6 4 9 7 10-1-4-1-7 0-9zm-7-2c-1 6 0 9 2 11 1-4 2-7 3-9z" fill="#f97316"/>
    </g>

    <g class="owl-breath">
